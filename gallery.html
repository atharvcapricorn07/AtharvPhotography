<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Atharv Photography 07</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@100&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* -------------------- Navbar (MATCHING INDEX) -------------------- */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 4rem;
      z-index: 1000;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      letter-spacing: 6px;
      font-weight: 300;
    }

    .logo a { text-decoration: none; color: white; }

    nav { display: flex; gap: 3rem; }
    nav a {
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-decoration: none;
      color: #fff;
      opacity: 0.4;
      transition: opacity 0.4s ease;
    }
    nav a.active, nav a:hover { opacity: 1; }

    /* -------------------- Gallery Header -------------------- */
    .page-intro {
      padding-top: 18vh;
      text-align: center;
      margin-bottom: 5vh;
    }

    .page-intro h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 2px;
    }

    /* -------------------- Filter Buttons -------------------- */
    .filter-buttons {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 4rem;
      position: relative;
      z-index: 10;
    }

    .filter-btn {
      background: none;
      border: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0.3;
      transition: opacity 0.3s;
    }

    .filter-btn.active, .filter-btn:hover {
      opacity: 1;
    }

    /* -------------------- Gallery Grid -------------------- */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      padding: 0 4rem 10rem 4rem;
    }

    .gallery-item {
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #0a0a0a;
      opacity: 0;
      transform: translateY(20px);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1);
      filter: grayscale(0.2) contrast(1.05);
    }

    .gallery-item img:hover {
      transform: scale(1.04);
      filter: grayscale(0);
    }

    .view-more-container {
      text-align: center;
      padding-bottom: 10rem;
    }

    @media (max-width: 1024px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: 1fr; }
      .navbar { padding: 2rem; }
      nav { gap: 1.5rem; }
    }

    /* -------------------- Lightbox -------------------- */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 2000;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      justify-content: center;
      align-items: center;
    }
    .lightbox-img { max-width: 90%; max-height: 85vh; object-fit: contain; }
    .close { position: absolute; top: 30px; right: 40px; font-size: 35px; cursor: pointer; color: #444; }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="logo"><a href="index.html">ATHARV KALE</a></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="awards.html">Awards</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="page-intro">
    <h1>Archive</h1>
  </section>

  <div class="filter-buttons">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="cars">Cars</button>
    <button class="filter-btn" data-category="landscapes">Landscapes</button>
    <button class="filter-btn" data-category="buildings">Architecture</button>
    <button class="filter-btn" data-category="animals">Fauna</button>
    <button class="filter-btn" data-category="shoots">Editorials</button>
  </div>

  <div class="gallery-grid" id="gallery"></div>

  <div class="view-more-container" id="view-more-container">
    <button id="view-more-btn" class="filter-btn">Load More</button>
  </div>

  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" id="lightbox-img">
  </div>

  <script>
    let allItems = [];
    let visibleLimit = 12;
    let currentCategory = 'all';

    async function init() {
      try {
        const response = await fetch('photos.json');
        const data = await response.json();
        const gallery = document.getElementById('gallery');

        Object.keys(data).forEach(cat => {
          if (cat === 'awards') return;
          data[cat].forEach(file => {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            div.dataset.category = cat;

            const img = document.createElement('img');
            img.src = `photos/${cat}/${file}`;
            img.loading = "lazy";
            img.onclick = () => openLightbox(img.src);

            div.appendChild(img);
            allItems.push(div);
            gallery.appendChild(div);
          });
        });

        // Randomize initial load
        allItems.sort(() => Math.random() - 0.5);
        render();
      } catch (err) { console.error("Error loading images:", err); }
    }

    function render() {
      let shown = 0;
      let matchCount = 0;

      allItems.forEach(item => {
        const isMatch = (currentCategory === 'all' || item.dataset.category === currentCategory);
        
        if (isMatch) {
          matchCount++;
          if (shown < visibleLimit) {
            item.style.display = 'block';
            gsap.to(item, { opacity: 1, y: 0, duration: 1.2, ease: "power2.out", delay: (shown % 6) * 0.1 });
            shown++;
          } else {
            item.style.display = 'none';
          }
        } else {
          item.style.display = 'none';
        }
      });

      document.getElementById('view-more-container').style.display = (visibleLimit < matchCount) ? 'block' : 'none';
    }

    document.getElementById('view-more-btn').onclick = () => {
      visibleLimit += 12;
      render();
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      if (btn.id === 'view-more-btn') return;
      btn.onclick = () => {
        document.querySelector('.filter-btn.active').classList.remove('active');
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        visibleLimit = 12;
        render();
      };
    });

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }

    document.querySelector('.close').onclick = () => document.getElementById('lightbox').style.display = 'none';
    document.getElementById('lightbox').onclick = (e) => {
      if(e.target.id === 'lightbox') document.getElementById('lightbox').style.display = 'none';
    };
    
    init();
  </script>
</body>
</html>
