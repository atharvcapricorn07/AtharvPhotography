<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Atharv Photography 07</title>

  <style>
    /* -------------------- Fonts -------------------- */
    @font-face {
      font-family: 'AlikeMisely';
      src: url('Alika Misely.ttf') format('truetype'); 
      font-weight: normal; font-style: normal;
    }
    @font-face {
      font-family: 'AlusintaBrenob';
      src: url('Alusinta Brenob.ttf') format('truetype');
      font-weight: normal; font-style: normal;
    }

    /* -------------------- Global & Background -------------------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { 
      height: 100%; 
      color: white; 
      font-family: Georgia, serif; 
      background: url('plain-green-paper-textured.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Depth Overlay */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,0,0,0.15) 100%);
      pointer-events: none;
      z-index: 1;
    }

    a { text-decoration: none; color: inherit; }

    /* -------------------- Navbar -------------------- */
    .navbar { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 1.2rem 3rem; 
      position: relative;
      z-index: 10;
    }
    .navbar-left { display: flex; align-items: center; gap: 2.5rem; }
    .logo { font-family: 'AlusintaBrenob', serif; font-size: 2.2rem; letter-spacing: 3px; text-transform: uppercase; white-space: nowrap; }
    nav { display: flex; gap: 1.6rem; }
    nav a { font-family: 'AlikeMisely', sans-serif; font-size: 1.05rem; opacity: 0.9; color: white; transition: opacity 0.2s ease; }
    nav a:hover, nav a.active { opacity: 1; font-weight: bold; }
    .navbar-right img { width: 28px; height: 28px; filter: brightness(0) invert(1); cursor: pointer; }

    @media (max-width: 768px) { .navbar { flex-direction: column; gap: 1rem; } nav { justify-content: center; } }

    /* -------------------- Gallery -------------------- */
    .page { position: relative; z-index: 5; padding: 5%; }
    
    .page-intro { 
        text-align: center; 
        margin: 3rem 1rem; 
        opacity: 0;
        animation: fadeUp 1s ease forwards;
    }
    .page-intro h1 { font-family: 'AlikeMisely', serif; font-size: 2.5rem; margin-bottom: 0.5rem; }
    
    .filter-buttons { 
        text-align: center; 
        margin-bottom: 2rem; 
        display: flex; 
        justify-content: center; 
        gap: 0.5rem; 
        flex-wrap: wrap;
        opacity: 0;
        animation: fadeUp 1s ease forwards;
        animation-delay: 0.2s;
    }
    .filter-btn { font-family: 'AlikeMisely', sans-serif; padding: 0.5rem 1rem; border: 1px solid #fff; background: transparent; color: #fff; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; transition: 0.3s; }
    .filter-btn:hover, .filter-btn.active { background: #fff; color: #000; }

    .gallery-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 2rem; }
    
    .gallery-item { 
      width: calc(33.333% - 10px); 
      display: none; 
      aspect-ratio: 3 / 2; 
      overflow: hidden; 
      border-radius: 8px;
      /* Animation properties */
      opacity: 0;
      transform: translateY(20px);
    }
    
    /* Animation Class triggered by JS */
    .gallery-item.animate {
      animation: fadeUp 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    .gallery-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: transform 0.3s ease; display: block; }
    .gallery-item img:hover { transform: scale(1.05); }

    .view-more-container { text-align: center; margin-bottom: 3rem; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1200px) { .gallery-item { width: calc(50% - 10px); } }
    @media (max-width: 768px) { .gallery-item { width: 100%; aspect-ratio: 4 / 3; } }

    /* -------------------- Lightbox -------------------- */
    .lightbox { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
    .lightbox-img { max-width: 90%; max-height: 85vh; border-radius: 6px; object-fit: contain; }
    .lightbox .close { position: absolute; top: 20px; right: 35px; font-size: 50px; color: #fff; cursor: pointer; }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="navbar-left">
      <div class="logo"><a href="index.html">ATHARV KALE</a></div>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="awards.html">Awards</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
    <div class="navbar-right">
      <a href="https://www.instagram.com/atharvphotography07/" target="_blank">
        <img src="images.png" alt="Instagram">
      </a>
    </div>
  </header>

  <section class="page">
    <div class="page-intro">
      <h1>Gallery</h1>
      <p>Browse the collection.</p>
    </div>

    <div class="filter-buttons">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="cars">Cars</button>
      <button class="filter-btn" data-category="buildings">Buildings</button>
      <button class="filter-btn" data-category="landscapes">Landscapes</button>
      <button class="filter-btn" data-category="animals">Animals</button>
      <button class="filter-btn" data-category="misc">Misc</button>
      <button class="filter-btn" data-category="shoots">Shoots</button>
    </div>

    <div class="gallery-grid" id="gallery"></div>

    <div class="view-more-container" id="view-more-container">
      <button id="view-more-btn" class="filter-btn" type="button">View More</button>
    </div>
  </section>

  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" id="lightbox-img">
  </div>

  <script>
    let allItems = [];
    let visibleLimit = 12;
    let currentCategory = 'all';

    async function init() {
      const gallery = document.getElementById('gallery');
      
      try {
        const response = await fetch('photos.json');
        const data = await response.json();

        Object.keys(data).forEach(cat => {
          if (cat === 'awards') return;
          data[cat].forEach(file => {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            div.dataset.category = cat;

            const img = document.createElement('img');
            img.src = `photos/${cat}/${file}`;
            img.onclick = (e) => {
                e.stopPropagation();
                openLightbox(img.src);
            };

            div.appendChild(img);
            allItems.push(div);
          });
        });

        // Shuffle once
        allItems.sort(() => Math.random() - 0.5);

        // Add to DOM
        allItems.forEach(item => gallery.appendChild(item));

        render();

      } catch (err) { console.error("Error:", err); }
    }

    function render() {
      let shown = 0;
      let matchCount = 0;

      allItems.forEach(item => {
        // Reset animation class so it can re-trigger
        item.classList.remove('animate');
        item.style.animationDelay = '0s';
        
        const isMatch = (currentCategory === 'all' || item.dataset.category === currentCategory);
        
        if (isMatch) {
          matchCount++;
          if (currentCategory === 'all') {
            if (shown < visibleLimit) {
              item.style.display = 'block';
              // Stagger the animation of visible items
              item.style.animationDelay = `${(shown % 12) * 0.1}s`;
              item.classList.add('animate');
              shown++;
            } else {
              item.style.display = 'none';
            }
          } else {
            item.style.display = 'block';
            item.classList.add('animate');
          }
        } else {
          item.style.display = 'none';
        }
      });

      const btnCont = document.getElementById('view-more-container');
      btnCont.style.display = (currentCategory === 'all' && visibleLimit < matchCount) ? 'block' : 'none';
    }

    document.getElementById('view-more-btn').addEventListener('click', function(e) {
      e.preventDefault();
      visibleLimit += 12;
      render();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      if (btn.id === 'view-more-btn') return;
      btn.addEventListener('click', () => {
        document.querySelector('.filter-btn.active').classList.remove('active');
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        visibleLimit = 12; 
        render();
      });
    });

    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      document.getElementById('lightbox-img').src = src;
      lb.style.display = 'flex';
    }

    document.querySelector('.close').onclick = () => document.getElementById('lightbox').style.display = 'none';
    document.getElementById('lightbox').onclick = (e) => {
      if (e.target.id === 'lightbox') document.getElementById('lightbox').style.display = 'none';
    };

    init();
  </script>
</body>
</html>
