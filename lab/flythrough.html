<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fly-through | Lab</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="lab.css">
<style>
  .stage { position: fixed; inset: 0; overflow: hidden; perspective: 900px; perspective-origin: 50% 50%; }
  .world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }
  .card {
    position: absolute; left: 0; top: 0; margin: 0; transform-style: preserve-3d; will-change: transform, opacity;
    border: 0; padding: 0; background: #111; cursor: zoom-in; border-radius: 4px; overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,0.6);
  }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .word {
    position: absolute; left: 0; top: 0; white-space: nowrap; transform-style: preserve-3d;
    font-family: "Newsreader", Georgia, serif; font-weight: 300; color: #f4f2ee; letter-spacing: -0.02em; line-height: 1;
    pointer-events: none;
  }
  .glow { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(60% 60% at 50% 50%, transparent 40%, rgba(0,0,0,0.75)); }
  .bar { position: fixed; left: 0; top: 0; height: 2px; background: #f4f2ee; z-index: 45; width: 0; opacity: 0.7; }
  .start { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-size: 0.8125rem; color: rgba(255,255,255,0.6); z-index: 41; transition: opacity 0.4s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .start i { width: 1px; height: 28px; background: linear-gradient(#fff, transparent); animation: drip 1.6s ease-in-out infinite; }
  @keyframes drip { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
  .view { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity 0.3s; cursor: zoom-out; }
  .view.open { opacity: 1; pointer-events: auto; }
  .view img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>
<a class="lab-back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Lab</a>
<div class="bar" id="bar"></div>
<div class="stage"><div class="world" id="world"></div></div>
<div class="glow"></div>
<div class="start" id="start">Scroll to fly in<i></i></div>
<div class="hud">
  <div>
    <p class="hud__title" id="title">&nbsp;</p>
    <p class="hud__sub" id="sub">&nbsp;</p>
  </div>
</div>
<div class="view" id="view"><img alt=""></div>
<div id="spacer"></div>
<script src="lab.js"></script>
<script>
// Real CSS 3D: every photo sits at its own depth in a perspective scene. Scrolling moves the camera
// forward; photos fade in out of the dark, drift past on either side and slide behind you.
(async function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const world = $("world");
  const SPACING = 680;
  const photos = await Lab.photos();
  // A varied run through every subject.
  const order = ["animals/animal11", "cars/car10", "landscapes/landscape12", "shoots/shoot-1", "cars/car16", "misc/misc26", "animals/animal17", "landscapes/landscape8",
    "cars/car13", "misc/misc11", "animals/animal12", "landscapes/landscape14", "cars/car17", "misc/misc14", "shoots/shoot-2", "animals/animal4", "cars/car3",
    "misc/misc18", "landscapes/landscape7", "animals/animal5", "cars/car14", "misc/misc23", "landscapes/landscape13", "animals/animal1", "shoots/shoot-3", "cars/car12",
    "misc/misc8", "landscapes/landscape6"];
  const list = order.map(photos.find).filter(Boolean);
  const mobile = innerWidth < 700;

  // Intro words floating in the scene, then the photos.
  const words = [
    { text: "Atharv Kale", z: -300, size: mobile ? 54 : 110, y: -0.06 },
    { text: "photographs", z: -900, size: mobile ? 40 : 80, y: 0.08 },
  ];
  const items = [];
  words.forEach((w) => {
    const el = document.createElement("div");
    el.className = "word"; el.textContent = w.text; el.style.fontSize = w.size + "px";
    world.appendChild(el);
    items.push({ el, z: w.z, x: 0, y: w.y * innerHeight, rot: 0, word: true });
  });

  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  list.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "card";
    const base = mobile ? innerWidth * 0.64 : Math.min(540, innerWidth * 0.34);
    const w = p.r >= 1 ? base * 1.25 : base, h = w / p.r;
    b.style.width = w + "px"; b.style.height = h + "px";
    b.setAttribute("aria-label", "View " + (p.title || p.label));
    const img = document.createElement("img");
    img.alt = ""; img.loading = "lazy"; img.decoding = "async"; img.src = p.src(960);
    b.appendChild(img);
    b.addEventListener("click", () => { const v = $("view"); v.querySelector("img").src = p.src(1920); v.classList.add("open"); });
    world.appendChild(b);
    const side = i % 2 ? 1 : -1;
    items.push({
      el: b, photo: p, w, h,
      z: -3000 - i * SPACING,
      x: side * (mobile ? innerWidth * (0.16 + rnd() * 0.12) : innerWidth * (0.17 + rnd() * 0.1)),
      y: (rnd() - 0.5) * innerHeight * (mobile ? 0.35 : 0.28),
      rot: -side * (8 + rnd() * 10),
    });
  });
  $("view").addEventListener("click", () => $("view").classList.remove("open"));

  const depth = -items[items.length - 1].z + 600;
  const SPEED = mobile ? 2.4 : 1.6; // scene units per scrolled pixel
  $("spacer").style.height = depth / SPEED + innerHeight + "px";

  let cam = 0, target = 0, current = -1;
  const onScroll = () => { target = scrollY * SPEED; $("start").style.opacity = scrollY > 40 ? 0 : 1; };
  addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  (function frame() {
    cam += (target - cam) * 0.08;
    world.style.transform = "translateZ(" + cam.toFixed(1) + "px)";
    let nearest = null, nd = Infinity;
    for (const it of items) {
      const d = it.z + cam; // distance in front of the camera is negative
      let o;
      if (d > 300) o = 0;                              // behind us
      else if (d > -100) o = (300 - d) / 400;          // passing the camera
      else if (d < -3600) o = 0;                       // too far to see
      else if (d < -2000) o = (d + 3600) / 1600;        // emerging from the dark
      else o = 1;
      it.el.style.opacity = o.toFixed(3);
      it.el.style.visibility = o > 0.01 ? "visible" : "hidden";
      const ox = it.word ? -it.el.offsetWidth / 2 : -it.w / 2 + it.x;
      const oy = it.word ? -it.el.offsetHeight / 2 + it.y : -it.h / 2 + it.y;
      it.el.style.transform = "translate3d(" + ox.toFixed(1) + "px," + oy.toFixed(1) + "px," + it.z + "px) rotateY(" + it.rot.toFixed(1) + "deg)";
      if (!it.word && d < -150 && -d < nd) { nd = -d; nearest = it; }
    }
    if (nearest && nearest !== current) {
      current = nearest;
      $("title").textContent = nearest.photo.title || nearest.photo.label;
      $("sub").textContent = nearest.photo.sub;
    }
    $("bar").style.width = Math.min(100, (cam / depth) * 100) + "%";
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
