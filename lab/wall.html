<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinite wall | Lab</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="lab.css">
<style>
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  .wall { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
  .wall.dragging { cursor: grabbing; }
  .plane { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
  .tile { position: absolute; left: 0; top: 0; margin: 0; padding: 0; border: 0; background: #111; border-radius: 6px; overflow: hidden; will-change: transform; }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; -webkit-user-drag: none; transition: transform 0.6s cubic-bezier(.22,1,.36,1), filter 0.4s; }
  .wall:not(.dragging) .tile:hover img { transform: scale(1.05); }
  .wall.dragging .tile img { filter: brightness(0.85); }
  .hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 41; pointer-events: none; padding: 12px 20px; border-radius: 999px; background: rgba(16,16,16,0.7); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); font-size: 0.875rem; transition: opacity 0.5s; }
  .view { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; opacity: 0; pointer-events: none; transition: opacity 0.3s; cursor: zoom-out; }
  .view.open { opacity: 1; pointer-events: auto; }
  .view img { max-width: 100%; max-height: calc(100% - 70px); object-fit: contain; transform: scale(0.96); transition: transform 0.4s cubic-bezier(.22,1,.36,1); }
  .view.open img { transform: none; }
  .view p { font-family: "Newsreader", Georgia, serif; font-size: 1.25rem; }
</style>
</head>
<body>
<a class="lab-back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Lab</a>
<div class="wall" id="wall"><div class="plane" id="plane"></div></div>
<div class="hint" id="hint">Drag in any direction</div>
<div class="view" id="view"><img alt=""><p></p></div>
<script src="lab.js"></script>
<script>
// Every photo on one endless wall. Each column wraps on its own, horizontally and vertically, so
// the wall never runs out. Columns drift at slightly different speeds for depth, and the whole wall
// pulls back when you throw it fast.
(async function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const wall = $("wall"), plane = $("plane");
  const photos = (await Lab.photos()).slice();
  // Shuffle so neighbours mix subjects.
  for (let i = photos.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [photos[i], photos[j]] = [photos[j], photos[i]]; }

  const mobile = innerWidth < 700;
  const CW = mobile ? 150 : 280, GAP = mobile ? 10 : 18, COLS = mobile ? 7 : 8;
  const cols = Array.from({ length: COLS }, (_, i) => ({ tiles: [], h: 0, speed: 0.86 + ((i * 37) % 7) * 0.045 }));
  photos.forEach((p) => {
    const col = cols.reduce((a, b) => (b.h < a.h ? b : a));
    const h = Math.round(CW / p.r);
    const el = document.createElement("button");
    el.type = "button"; el.className = "tile";
    el.style.width = CW + "px"; el.style.height = h + "px";
    el.setAttribute("aria-label", "View " + (p.title || p.label));
    const img = document.createElement("img");
    img.alt = ""; img.decoding = "async"; img.loading = "lazy"; img.src = p.src(mobile ? 480 : 480);
    img.draggable = false;
    el.appendChild(img);
    plane.appendChild(el);
    col.tiles.push({ el, y: col.h, h, p });
    col.h += h + GAP;
  });
  const WORLD_W = COLS * (CW + GAP);

  let ox = 0, oy = 0, vx = 0, vy = 0, dragging = false, moved = 0, last = null;
  // Start roughly centered on the wall.
  ox = -WORLD_W / 2 + innerWidth / 2; oy = -400;

  wall.addEventListener("pointerdown", (e) => {
    dragging = true; moved = 0; vx = vy = 0;
    last = { x: e.clientX, y: e.clientY, t: performance.now() };
    wall.setPointerCapture(e.pointerId);
  });
  wall.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const now = performance.now(), dx = e.clientX - last.x, dy = e.clientY - last.y, dt = Math.max(1, now - last.t);
    ox += dx; oy += dy; moved += Math.abs(dx) + Math.abs(dy);
    vx = vx * 0.6 + (dx / dt) * 16 * 0.4; vy = vy * 0.6 + (dy / dt) * 16 * 0.4;
    last = { x: e.clientX, y: e.clientY, t: now };
    if (moved > 6) { wall.classList.add("dragging"); $("hint").style.opacity = 0; }
  });
  const end = (e) => {
    if (!dragging) return;
    dragging = false; wall.classList.remove("dragging");
    if (moved < 6) {
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const tile = target && target.closest(".tile");
      if (tile) open(tile);
    }
  };
  wall.addEventListener("pointerup", end);
  wall.addEventListener("pointercancel", end);
  wall.addEventListener("wheel", (e) => { e.preventDefault(); vx -= e.deltaX * 0.35; vy -= e.deltaY * 0.35; $("hint").style.opacity = 0; }, { passive: false });
  addEventListener("keydown", (e) => {
    const k = { ArrowLeft: [30, 0], ArrowRight: [-30, 0], ArrowUp: [0, 30], ArrowDown: [0, -30] }[e.key];
    if (k) { vx += k[0]; vy += k[1]; }
    if (e.key === "Escape") $("view").classList.remove("open");
  });

  const byEl = new Map(); cols.forEach((c) => c.tiles.forEach((t) => byEl.set(t.el, t)));
  function open(el) {
    const t = byEl.get(el), v = $("view");
    v.querySelector("img").src = t.p.src(1920);
    v.querySelector("p").textContent = t.p.title || t.p.label;
    v.classList.add("open");
  }
  $("view").addEventListener("click", () => $("view").classList.remove("open"));

  const mod = (a, n) => ((a % n) + n) % n;
  let zoom = 1;
  (function frame() {
    if (!dragging) { ox += vx; oy += vy; vx *= 0.94; vy *= 0.94; }
    const speed = Math.hypot(vx, vy);
    const targetZoom = 1 - Math.min(speed / 60, 1) * (mobile ? 0.12 : 0.16);
    zoom += (targetZoom - zoom) * 0.12;
    plane.style.transform = "scale(" + zoom.toFixed(4) + ")";
    cols.forEach((c, i) => {
      const x = mod(i * (CW + GAP) + ox, WORLD_W) - (CW + GAP);
      const colY = oy * c.speed;
      c.tiles.forEach((t) => {
        const y = mod(t.y + colY, c.h) - (CW * 1.6);
        t.el.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0)";
      });
    });
    requestAnimationFrame(frame);
  })();
  setTimeout(() => ($("hint").style.opacity = 0), 4000);
})();
</script>
</body>
</html>
