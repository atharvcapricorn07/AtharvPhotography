<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Particles | Lab</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="lab.css">
<style>
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
</style>
</head>
<body>
<a class="lab-back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Lab</a>
<canvas id="c" aria-label="Photograph drawn with particles"></canvas>
<div class="loading" id="loading">Loading</div>
<div class="hud">
  <div>
    <p class="hud__title" id="title">&nbsp;</p>
    <p class="hud__sub" id="sub">&nbsp;</p>
    <p class="hud__hint">Touch or move across the photo. Tap for the next one.</p>
  </div>
  <div class="hud__btns">
    <button class="round" id="next" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>
<script src="lab.js"></script>
<script>
// Each photo is resampled onto a grid and drawn as ~20,000 GPU particles (one per grid cell).
// Particles flee the pointer, and between photos they lift off into a vortex and land as the next image.
(async function () {
  "use strict";
  const PICKS = ["animals/animal11", "cars/car10", "landscapes/landscape12", "misc/misc26", "animals/animal12", "cars/car16", "misc/misc17", "shoots/shoot-1", "landscapes/landscape8", "cars/car17"];
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl", { antialias: false, alpha: false, premultipliedAlpha: false });
  const $ = (id) => document.getElementById(id);
  if (!gl) { $("loading").textContent = "This experiment needs WebGL."; return; }

  const VS = `
  attribute vec2 aGrid; attribute vec4 aRand; attribute vec3 aColA; attribute vec3 aColB;
  uniform float uTime, uProgress, uIntro, uSize, uPress; uniform vec2 uPointer, uRes;
  varying vec3 vCol; varying float vAlpha;
  void main() {
    float d = aRand.x * 0.45;
    float p = clamp((uProgress - d) / 0.55, 0.0, 1.0);
    p = p * p * (3.0 - 2.0 * p);
    float lift = sin(p * 3.14159);
    float ang = aRand.y * 6.28318 + uTime * 0.7 + p * 4.0;
    vec2 swirl = vec2(cos(ang), sin(ang)) * (0.15 + aRand.z * 0.85) * lift;
    float ip = clamp((uIntro - aRand.w * 0.55) / 0.45, 0.0, 1.0);
    ip = 1.0 - pow(1.0 - ip, 3.0);
    vec2 scatter = (aRand.zy * 2.0 - 1.0) * 2.4;
    vec2 pos = mix(scatter, aGrid + swirl, ip);
    vec2 asp = vec2(uRes.x / uRes.y, 1.0);
    vec2 dv = (pos - uPointer) * asp;
    float dist = length(dv);
    float force = uPress * exp(-dist * dist * 14.0);
    pos += (dv / (dist + 0.0001)) / asp * force * 0.22;
    pos += vec2(sin(uTime * 0.9 + aRand.x * 6.28), cos(uTime * 0.8 + aRand.y * 6.28)) * 0.0016;
    vCol = mix(aColA, aColB, p) * (1.0 + force * 0.6);
    vAlpha = ip;
    gl_PointSize = uSize * (1.0 + force * 1.6 + lift * aRand.w * 1.4) * (0.5 + 0.5 * ip);
    gl_Position = vec4(pos, 0.0, 1.0);
  }`;
  const FS = `
  precision mediump float; varying vec3 vCol; varying float vAlpha;
  void main() {
    float r = length(gl_PointCoord - 0.5);
    if (r > 0.5) discard;
    gl_FragColor = vec4(vCol, smoothstep(0.5, 0.36, r) * vAlpha);
  }`;

  function shader(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const U = {}; ["uTime", "uProgress", "uIntro", "uSize", "uPress", "uPointer", "uRes"].forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));
  const A = {}; ["aGrid", "aRand", "aColA", "aColB"].forEach((n) => (A[n] = gl.getAttribLocation(prog, n)));
  const buf = {}; Object.keys(A).forEach((k) => (buf[k] = gl.createBuffer()));
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  function attr(name, data, size) {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf[name]);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(A[name]);
    gl.vertexAttribPointer(A[name], size, gl.FLOAT, false, 0, 0);
  }

  let cols, rows, N, dpr, W, H, colA, colB;
  const sampler = document.createElement("canvas").getContext("2d", { willReadFrequently: true });

  function layout() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    cols = W < 700 ? 92 : W < 1200 ? 150 : 190;
    rows = Math.round(cols * H / W);
    N = cols * rows;
    const grid = new Float32Array(N * 2), rand = new Float32Array(N * 4);
    for (let i = 0; i < N; i++) {
      const c = i % cols, r = (i / cols) | 0;
      grid[i * 2] = ((c + 0.5) / cols) * 2 - 1;
      grid[i * 2 + 1] = 1 - ((r + 0.5) / rows) * 2;
      for (let k = 0; k < 4; k++) rand[i * 4 + k] = Math.random();
    }
    attr("aGrid", grid, 2);
    attr("aRand", rand, 4);
    gl.uniform2f(U.uRes, W, H);
    gl.uniform1f(U.uSize, (W / cols) * dpr * 0.98);
  }

  // Cover-crop the image onto the grid and read one color per particle.
  function sample(img) {
    sampler.canvas.width = cols; sampler.canvas.height = rows;
    const s = Math.max(cols / img.width, rows / img.height);
    const w = img.width * s, h = img.height * s;
    sampler.drawImage(img, (cols - w) / 2, (rows - h) / 2, w, h);
    const px = sampler.getImageData(0, 0, cols, rows).data;
    const out = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) for (let k = 0; k < 3; k++) out[i * 3 + k] = Math.min(1, (px[i * 4 + k] / 255) * 1.12);
    return out;
  }

  const photos = await Lab.photos();
  const list = PICKS.map(photos.find).filter(Boolean);
  const cache = new Map();
  const getImg = (p) => { if (!cache.has(p.ref)) cache.set(p.ref, Lab.load(p.src(480))); return cache.get(p.ref); };

  let index = 0, img = await getImg(list[0]);
  layout();
  colA = sample(img); colB = colA;
  attr("aColA", colA, 3); attr("aColB", colB, 3);
  $("loading").remove();
  const caption = (p) => { $("title").textContent = p.title || p.label; $("sub").textContent = p.sub; };
  caption(list[0]);
  getImg(list[1]);

  let progress = 0, transitioning = false, intro = 0, press = 0, pressTarget = 0;
  const pointer = { x: 9, y: 9 };

  async function next() {
    if (transitioning) return;
    transitioning = true;
    index = (index + 1) % list.length;
    const nimg = await getImg(list[index]);
    getImg(list[(index + 1) % list.length]);
    img = nimg;
    colB = sample(img);
    attr("aColB", colB, 3);
    caption(list[index]);
    const start = performance.now(), dur = 2600;
    (function step(now) {
      progress = Math.min(1, (now - start) / dur);
      if (progress < 1) requestAnimationFrame(step);
      else { colA = colB; attr("aColA", colA, 3); progress = 0; transitioning = false; }
    })(start);
  }

  function toClip(e) { pointer.x = (e.clientX / W) * 2 - 1; pointer.y = 1 - (e.clientY / H) * 2; }
  let downAt = null;
  canvas.addEventListener("pointermove", (e) => { toClip(e); if (e.pointerType === "mouse" || e.buttons) pressTarget = 1; });
  canvas.addEventListener("pointerdown", (e) => { toClip(e); pressTarget = 1; downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener("pointerup", (e) => {
    if (e.pointerType !== "mouse") pressTarget = 0;
    if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 10 && performance.now() - downAt.t < 350) next();
    downAt = null;
  });
  canvas.addEventListener("pointerleave", () => (pressTarget = 0));
  canvas.addEventListener("pointercancel", () => (pressTarget = 0));
  $("next").addEventListener("click", next);
  addEventListener("keydown", (e) => { if (e.key === "ArrowRight" || e.key === " ") next(); });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { layout(); colA = sample(img); colB = colA; attr("aColA", colA, 3); attr("aColB", colB, 3); }, 150); });

  const t0 = performance.now();
  (function frame(now) {
    const t = (now - t0) / 1000;
    intro = Math.min(1, t / 2.4);
    press += (pressTarget - press) * 0.12;
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uProgress, progress);
    gl.uniform1f(U.uIntro, intro);
    gl.uniform1f(U.uPress, press);
    gl.uniform2f(U.uPointer, pointer.x, pointer.y);
    gl.drawArrays(gl.POINTS, 0, N);
    requestAnimationFrame(frame);
  })(t0);
})().catch((e) => { document.getElementById("loading").textContent = "Couldn't start: " + e.message; });
</script>
</body>
</html>
