<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atharv Kale Photography</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;600&display=swap" rel="stylesheet">

  <style>
    /* -------------------- Fonts -------------------- */
    @font-face {
      font-family: 'AlikeMisely';
      src: url('Alika Misely.ttf') format('truetype');
      font-weight: normal; font-style: normal;
    }

    @font-face {
      font-family: 'AlusintaBrenob';
      src: url('Alusinta Brenob.ttf') format('truetype');
      font-weight: normal; font-style: normal;
    }

    /* -------------------- Global -------------------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body { 
      height: 100%; 
      color: white; 
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: url('plain-green-paper-textured.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,0,0,0.15) 100%);
      pointer-events: none;
      z-index: 1;
    }
    
    a { text-decoration: none; color: inherit; }

    /* -------------------- Navbar (KEPT EXACTLY AS IT WAS) -------------------- */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 3rem;
      background-color: transparent; 
      position: relative;
      z-index: 10;
    }
    
    .navbar-left { display: flex; align-items: center; gap: 2.5rem; }

    .logo {
      font-family: 'AlusintaBrenob', serif;
      font-size: 2.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    nav { display: flex; gap: 1.6rem; }
    
    nav a {
      font-family: 'AlikeMisely', sans-serif;
      font-size: 1.05rem;
      opacity: 0.9;
      transition: opacity 0.2s ease;
      color: white;
    }

    nav a:hover, nav a.active {
      opacity: 1;
      font-weight: bold;
    }

    .navbar-right img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      cursor: pointer;
    }

    /* -------------------- Hero (Artistic & Clean) -------------------- */
    .hero {
      height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      padding: 0 8%;
      position: relative;
      z-index: 5;
    }

    .hero-content {
      max-width: 1100px;
      opacity: 0;
      animation: fadeUp 1.4s cubic-bezier(0.19, 1, 0.22, 1) forwards;
      animation-delay: 0.3s;
    }

    .hero-text {
      font-size: clamp(2.2rem, 5.5vw, 4.8rem);
      line-height: 1.1;
      color: #fff;
      font-weight: 300;
    }

    /* Artistic Serif for the "Bigger" words */
    .artistic {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      letter-spacing: -1px;
    }

    /* Clean, thin lowercase for the "connective" words */
    .details {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 0.8em;
      opacity: 0.8;
      margin: 0 5px;
    }

    /* -------------------- Animations -------------------- */
    @keyframes fadeUp {
      from { 
        opacity: 0; 
        transform: translateY(30px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    @media (max-width: 768px) {
      .navbar { flex-direction: column; gap: 1rem; }
      nav { justify-content: center; }
      .hero-text { font-size: 2.5rem; line-height: 1.2; }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="navbar-left">
      <div class="logo"><a href="index.html">ATHARV KALE</a></div>
      <nav>
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="awards.html">Awards</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
    <div class="navbar-right">
      <a href="https://www.instagram.com/atharvphotography07/" target="_blank">
        <img src="images.png" alt="Instagram">
      </a>
    </div>
  </header>

  <main class="hero">
    <div class="hero-content">
      <h1 class="hero-text">
        Atharv <span class="details">is a</span> <span class="artistic">Visionary</span> <br>
        <span class="artistic">Photographer</span> <span class="details">&</span> <span class="artistic">Storyteller</span> <br>
        <span class="details">creating</span> <span class="artistic">Portraiture</span>, <br>
        <span class="artistic">Landscapes</span>, <span class="details">and</span> <span class="artistic">Editorial Imagery</span>.
      </h1>
    </div>
  </main>

</body>
</html>
