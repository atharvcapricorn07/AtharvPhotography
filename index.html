<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atharv Kale | Photography</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@100&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      height: 100%;
      background-color: #000; /* Deepest black */
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow: hidden; /* No scrolling */
    }

    /* -------------------- Fixed Navbar -------------------- */
    .navbar {
      position: absolute;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 2.5rem 4rem;
      z-index: 100;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      letter-spacing: 6px;
      font-weight: 300;
    }

    nav { display: flex; gap: 3rem; }
    nav a {
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-decoration: none;
      color: #fff;
      opacity: 0.4;
      transition: opacity 0.4s ease;
    }
    nav a:hover { opacity: 1; }

    /* -------------------- Interactive Light -------------------- */
    /* This creates the "flashlight" effect */
    .flashlight {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(
        circle at var(--x, 50%) var(--y, 50%), 
        transparent 0%, 
        rgba(0,0,0,0.95) 45%
      );
    }

    /* -------------------- Hero Content -------------------- */
    main {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .content-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10vw;
      width: 90%;
    }

    .hero-text {
      max-width: 500px;
    }

    .hero-text h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem;
      font-weight: 300;
      line-height: 1.1;
      font-style: italic;
    }

    .hero-text p {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .camera-visual {
      width: 500px;
      filter: drop-shadow(0 0 50px rgba(255,255,255,0.05));
    }

    /* -------------------- Bottom Label -------------------- */
    .coordinates {
      position: absolute;
      bottom: 2.5rem;
      left: 4rem;
      font-size: 10px;
      letter-spacing: 2px;
      opacity: 0.3;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="flashlight" id="flashlight"></div>

  <header class="navbar">
    <div class="logo">ATHARV KALE</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="awards.html">Awards</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <div class="content-wrapper">
      <div class="hero-text">
        <h1>I capture the stories <br> hidden in the light.</h1>
        <p>Visual Narrative & Editorial</p>
      </div>
      
      <div class="camera-container">
        <img src="camera.png" alt="Hardware" class="camera-visual">
      </div>
    </div>
  </main>

  <div class="coordinates">LAT: 47.6061 | LONG: 122.3328 // SHUTTER_EXP_007</div>

  <script>
    const flashlight = document.getElementById('flashlight');

    // Light follows mouse
    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 100;
      const y = (e.clientY / window.innerHeight) * 100;
      
      // Update the CSS variables for the radial gradient
      flashlight.style.setProperty('--x', x + '%');
      flashlight.style.setProperty('--y', y + '%');
    });

    // Initial load animation
    gsap.from(".content-wrapper", {
      opacity: 0,
      scale: 0.98,
      duration: 2.5,
      ease: "power2.out"
    });

    gsap.from(".logo", {
      y: -20,
      opacity: 0,
      duration: 1.5,
      delay: 0.5
    });
  </script>
</body>
</html>
