<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awards | Atharv Photography 07</title>

  <style>
    /* -------------------- Fonts -------------------- */
    @font-face {
      font-family: 'AlikeMisely';
      src: url('Alika Misely.ttf') format('truetype');
      font-weight: normal; font-style: normal;
    }

    @font-face {
      font-family: 'AlusintaBrenob';
      src: url('Alusinta Brenob.ttf') format('truetype');
      font-weight: normal; font-style: normal;
    }

    /* -------------------- Global & Background -------------------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      height: 100%;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      background: url('plain-green-paper-textured.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Depth Overlay */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(0,0,0,0.15) 100%);
      pointer-events: none;
      z-index: 1;
    }
    
    a { text-decoration: none; color: inherit; }

    /* -------------------- Navbar -------------------- */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 3rem;
      position: relative;
      z-index: 10;
    }
    
    .navbar-left { display: flex; align-items: center; gap: 2.5rem; }

    .logo {
      font-family: 'AlusintaBrenob', serif;
      font-size: 2.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    nav { display: flex; gap: 1.6rem; }
    
    nav a {
      font-family: 'AlikeMisely', sans-serif;
      font-size: 1.05rem;
      opacity: 0.9;
      transition: opacity 0.2s ease;
      color: white;
    }

    nav a:hover, nav a.active {
      opacity: 1;
      font-weight: bold;
    }

    .navbar-right img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .navbar { flex-direction: column; gap: 1rem; }
      nav { justify-content: center; }
    }

    /* -------------------- Page Content -------------------- */
    .page { position: relative; z-index: 5; padding: 5%; }
    
    .page-intro { 
      text-align: center; 
      margin: 3rem 1rem; 
      opacity: 0;
      animation: fadeUp 1s ease forwards;
    }
    
    .page-intro h1 { 
      font-family: 'AlikeMisely', serif;
      font-size: 2.5rem; 
      margin-bottom: 0.5rem; 
    }
    
    .page-intro p { font-size: 1rem; color: #e0e0e0; }

    /* -------------------- Gallery Grid -------------------- */
    .gallery-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 2rem; }
    
    .gallery-grid img { 
      width: calc(33.333% - 10px); 
      border-radius: 8px; 
      object-fit: cover; 
      cursor: pointer; 
      transition: transform 0.3s ease, box-shadow 0.3s ease; 
      /* Initial state for animation */
      opacity: 0;
      transform: translateY(20px);
    }
    
    .gallery-grid img.animate {
      animation: fadeUp 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }
    
    .gallery-grid img:hover { 
      transform: scale(1.03); 
      box-shadow: 0 4px 15px rgba(255,255,255,0.2); 
    }
    
    .view-more-container { text-align: center; margin-bottom: 3rem; }
    
    .filter-btn { 
      font-family: 'AlikeMisely', sans-serif;
      padding: 0.5rem 1rem; 
      border: 1px solid #fff; 
      background: transparent; 
      color: #fff; 
      border-radius: 6px; 
      cursor: pointer; 
      text-transform: uppercase; 
      font-size: 0.9rem; 
      transition: all 0.3s ease; 
    }
    
    .filter-btn:hover { background: #fff; color: #000; }

    /* -------------------- Lightbox -------------------- */
    .lightbox { 
      display: none; 
      position: fixed; 
      z-index: 1000; 
      top:0; left:0; 
      width:100%; height:100%; 
      background: rgba(0,0,0,0.85); 
      justify-content:center; 
      align-items:center; 
      padding-top:60px; 
    }
    
    .lightbox-img { max-width: 90%; max-height: 80vh; border-radius: 6px; }
    
    .lightbox .close { 
      position:absolute; 
      top:20px; 
      right:35px; 
      font-size:40px; 
      color:#fff; 
      cursor:pointer; 
    }

    /* -------------------- Animations -------------------- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1200px) { .gallery-grid img { width: calc(50% - 10px); } }
    @media (max-width: 768px) { .gallery-grid img { width: 100%; } }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar-left">
      <div class="logo"><a href="index.html">ATHARV KALE</a></div>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="awards.html" class="active">Awards</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
    <div class="navbar-right">
      <a href="https://www.instagram.com/atharvphotography07/" target="_blank">
        <img src="images.png" alt="Instagram">
      </a>
    </div>
  </header>

  <section class="page">
    <section class="page-intro">
      <h1>Awards & Recognitions</h1>
      <p>Honors and accolades I’ve received for my photography work.</p>
    </section>

    <section class="gallery-grid" id="gallery"></section>

    <div class="view-more-container">
      <button id="view-more-btn" class="filter-btn">View More</button>
    </div>
  </section>

  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" id="lightbox-img" src="" />
  </div>

  <script>
    async function loadAwards() {
      const gallery = document.getElementById("gallery");
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightbox-img");
      const closeBtn = document.querySelector(".lightbox .close");
      const viewMoreBtn = document.getElementById("view-more-btn");

      try {
        const response = await fetch("photos.json");
        const data = await response.json();
        const awardsList = data.awards || [];
        const allImages = [];

        awardsList.forEach((filename, index) => {
          const img = document.createElement("img");
          img.src = `photos/awards/${filename}`;
          img.style.display = "none";

          img.addEventListener("click", () => {
            lightbox.style.display = "flex";
            lightboxImg.src = img.src;
          });

          gallery.appendChild(img);
          allImages.push(img);
        });

        const INITIAL_COUNT = 6;
        
        // Show and animate initial batch
        allImages.slice(0, INITIAL_COUNT).forEach((img, i) => {
          img.style.display = "block";
          // Stagger the animation
          setTimeout(() => {
            img.classList.add('animate');
          }, i * 100 + 400); // 400ms delay to wait for page intro
        });

        if (allImages.length <= INITIAL_COUNT) viewMoreBtn.style.display = "none";

        viewMoreBtn.addEventListener("click", () => {
          let delayCount = 0;
          allImages.forEach(img => { 
            if (img.style.display === "none") {
              img.style.display = "block";
              setTimeout(() => {
                img.classList.add('animate');
              }, delayCount * 100);
              delayCount++;
            }
          });
          viewMoreBtn.style.display = "none";
        });

        closeBtn.addEventListener("click", () => {
          lightbox.style.display = "none";
          lightboxImg.src = "";
        });

        lightbox.addEventListener("click", e => {
          if (e.target === lightbox) {
            lightbox.style.display = "none";
            lightboxImg.src = "";
          }
        });

      } catch (err) {
        console.error("Error loading awards:", err);
      }
    }

    loadAwards();
  </script>

</body>
</html>
