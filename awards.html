<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awards | Atharv Photography 07</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@100;200&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    /* -------------------- Global & Theme -------------------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    
    a { text-decoration: none; color: inherit; }

    /* -------------------- Navbar (MATCHING ALL PAGES) -------------------- */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 4rem;
      z-index: 1000;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      letter-spacing: 6px;
      font-weight: 300;
      text-transform: uppercase;
    }

    nav { display: flex; gap: 3rem; }
    
    nav a {
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      opacity: 0.4;
      transition: opacity 0.4s ease;
    }

    nav a.active, nav a:hover { opacity: 1; }

    /* -------------------- Page Content -------------------- */
    .page-intro { 
      padding-top: 18vh;
      text-align: center; 
      margin-bottom: 6vh;
    }
    
    .page-intro h1 { 
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem; 
      font-weight: 300;
      font-style: italic;
      letter-spacing: 2px;
    }
    
    .page-intro p { 
      font-size: 0.75rem; 
      text-transform: uppercase; 
      letter-spacing: 3px; 
      opacity: 0.5;
      margin-top: 10px;
    }

    /* -------------------- Awards Grid -------------------- */
    .gallery-grid { 
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      padding: 0 4rem 5rem 4rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .gallery-grid img { 
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover; 
      cursor: pointer; 
      background: #0a0a0a;
      transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1);
      filter: grayscale(0.4) contrast(1.1);
      opacity: 0;
      transform: translateY(20px);
    }
    
    .gallery-grid img.animate {
      opacity: 1;
      transform: translateY(0);
    }
    
    .gallery-grid img:hover { 
      transform: scale(1.03); 
      filter: grayscale(0);
    }
    
    .view-more-container { text-align: center; padding-bottom: 10rem; }
    
    .filter-btn { 
      background: none;
      border: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0.3;
      transition: opacity 0.3s;
      border-bottom: 1px solid transparent;
    }
    
    .filter-btn:hover { opacity: 1; border-bottom: 1px solid white; }

    /* -------------------- Lightbox -------------------- */
    .lightbox { 
      display: none; 
      position: fixed; 
      z-index: 2000; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: #000; 
      justify-content: center; 
      align-items: center; 
    }
    
    .lightbox-img { max-width: 90%; max-height: 85vh; object-fit: contain; }
    
    .close { 
      position: absolute; 
      top: 30px; 
      right: 40px; 
      font-size: 35px; 
      color: #444; 
      cursor: pointer; 
    }

    /* -------------------- Mobile (MATCHING ALL PAGES) -------------------- */
    @media (max-width: 770px) {
      .navbar { 
        padding: 2rem 1rem;
        flex-direction: column; 
        gap: 1.5rem;
        background: rgba(0,0,0,0.9);
      }
      
      nav { 
        gap: 1.2rem; 
        flex-wrap: wrap;
        justify-content: center;
      }

      nav a {
        font-size: 0.65rem;
        letter-spacing: 2px;
      }

      .page-intro { padding-top: 160px; }
      .page-intro h1 { font-size: 2.8rem; }
      .page-intro p { font-size: 0.6rem; }

      .gallery-grid { 
        grid-template-columns: 1fr; /* Stacked for mobile readability */
        padding: 0 1.5rem 5rem 1.5rem; 
        gap: 20px;
      }

      .close { top: 20px; right: 20px; font-size: 30px; }
    }

    @media (min-width: 771px) and (max-width: 1024px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo"><a href="index.html">ATHARV KALE</a></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
      <a href="awards.html" class="active">Awards</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="page">
    <section class="page-intro">
      <h1>Honors</h1>
      <p>Recognitions of light and perspective</p>
    </section>

    <section class="gallery-grid" id="gallery"></section>

    <div class="view-more-container">
      <button id="view-more-btn" class="filter-btn">Expand Archive</button>
    </div>
  </section>

  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" id="lightbox-img" src="" />
  </div>

  <script>
    async function loadAwards() {
      const gallery = document.getElementById("gallery");
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightbox-img");
      const closeBtn = document.querySelector(".close");
      const viewMoreBtn = document.getElementById("view-more-btn");

      try {
        const response = await fetch("photos.json");
        const data = await response.json();
        const awardsList = data.awards || [];
        const allImages = [];

        awardsList.forEach((filename) => {
          const img = document.createElement("img");
          img.src = `photos/awards/${filename}`;
          img.style.display = "none";
          img.loading = "lazy";

          img.addEventListener("click", () => {
            lightbox.style.display = "flex";
            lightboxImg.src = img.src;
            document.body.style.overflow = 'hidden'; // Prevent mobile scroll
          });

          gallery.appendChild(img);
          allImages.push(img);
        });

        const INITIAL_COUNT = 6;
        
        allImages.slice(0, INITIAL_COUNT).forEach((img, i) => {
          img.style.display = "block";
          setTimeout(() => {
            img.classList.add('animate');
          }, i * 150 + 200);
        });

        if (allImages.length <= INITIAL_COUNT) viewMoreBtn.style.display = "none";

        viewMoreBtn.addEventListener("click", () => {
          let delayCount = 0;
          allImages.forEach(img => { 
            if (img.style.display === "none") {
              img.style.display = "block";
              setTimeout(() => {
                img.classList.add('animate');
              }, delayCount * 150);
              delayCount++;
            }
          });
          viewMoreBtn.style.display = "none";
        });

        const closeLightbox = () => {
          lightbox.style.display = "none";
          document.body.style.overflow = 'auto'; // Restore scroll
        };

        closeBtn.addEventListener("click", closeLightbox);
        lightbox.addEventListener("click", e => {
          if (e.target === lightbox) closeLightbox();
        });

      } catch (err) {
        console.error("Error loading awards:", err);
      }
    }

    loadAwards();
  </script>

</body>
</html>
