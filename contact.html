<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Atharv Photography 07</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@100;200&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    /* -------------------- Global & Theme -------------------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html { 
      height: 100%; 
      color: white; 
      font-family: 'Inter', sans-serif;
      background-color: #000;
      overflow-x: hidden;
    }
    
    a { text-decoration: none; color: inherit; }

    /* -------------------- Navbar (MATCHING ALL PAGES) -------------------- */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 4rem;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      letter-spacing: 6px;
      font-weight: 300;
      text-transform: uppercase;
    }

    nav { display: flex; gap: 3rem; }
    
    nav a {
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      opacity: 0.4;
      transition: opacity 0.4s ease;
    }

    nav a:hover, nav a.active {
      opacity: 1;
    }

    /* -------------------- Contact Page -------------------- */
    .page-intro { 
      padding-top: 18vh;
      text-align: center; 
      margin-bottom: 4vh;
    }
    
    .page-intro h1 { 
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem; 
      font-weight: 300;
      font-style: italic;
      letter-spacing: 2px;
    }

    .contact-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 2rem 10rem 2rem;
      text-align: center;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .contact-form input,
    .contact-form textarea {
      padding: 1.2rem 1rem;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.4s ease;
      resize: none;
      border-radius: 0;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border-bottom-color: #fff;
    }

    .contact-form button {
      margin-top: 2rem;
      padding: 1.2rem;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.4s ease;
    }

    .contact-form button:hover {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .info-grid {
      margin-top: 5rem;
      display: flex;
      justify-content: center;
      gap: 4rem;
      opacity: 0.6;
    }

    .info-item h3 {
      font-size: 0.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      font-weight: 400;
    }

    .info-item p, .info-item a {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-style: italic;
    }

    .info-item a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* -------------------- Mobile (MATCHING ALL PAGES) -------------------- */
    @media (max-width: 770px) {
      .navbar { 
        padding: 2rem 1rem;
        flex-direction: column; 
        gap: 1.5rem;
        background: rgba(0,0,0,0.9);
      }
      
      nav { 
        gap: 1.2rem; 
        flex-wrap: wrap;
        justify-content: center;
      }

      nav a {
        font-size: 0.65rem;
        letter-spacing: 2px;
      }

      .page-intro { padding-top: 160px; }
      .page-intro h1 { font-size: 2.8rem; }

      .contact-container {
        padding-bottom: 5rem;
      }

      .info-grid { 
        flex-direction: column; 
        gap: 2.5rem; 
        margin-top: 4rem;
      }

      .info-item p, .info-item a {
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="logo"><a href="index.html">ATHARV KALE</a></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
      <a href="awards.html">Awards</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <section class="page">
    <section class="page-intro">
      <h1>Let's Connect</h1>
    </section>

    <div class="contact-container">
      <form
        class="contact-form"
        action="https://formspree.io/f/mjkoqoka"
        method="POST"
      >
        <input type="text" name="name" placeholder="FULL NAME" required />
        <input type="email" name="_replyto" placeholder="EMAIL ADDRESS" required />
        <textarea name="message" rows="4" placeholder="HOW CAN I HELP YOU?" required></textarea>
        <button type="submit">Send Inquiry</button>
      </form>

      <div class="info-grid">
        <div class="info-item">
          <h3>Instagram</h3>
          <a href="https://www.instagram.com/atharvphotography07/" target="_blank">@atharvphotography07</a>
        </div>
      </div>
    </div>
  </section>

  <script>
    // Reveal Animations
    gsap.from(".page-intro h1", {
      opacity: 0,
      y: 30,
      duration: 1.5,
      ease: "power3.out"
    });

    gsap.from(".contact-form", {
      opacity: 0,
      y: 20,
      duration: 1.5,
      delay: 0.4,
      ease: "power2.out"
    });

    gsap.from(".info-item", {
      opacity: 0,
      y: 20,
      duration: 1.2,
      delay: 0.8,
      stagger: 0.2,
      ease: "power2.out"
    });
  </script>

</body>
</html>
